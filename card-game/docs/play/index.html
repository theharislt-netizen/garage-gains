<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PALACE</title>
<meta name="theme-color" content="#09080f">
<style>
  html, body { margin: 0; background: #09080f; color: #f4f2f9; font-family: Inter, system-ui, sans-serif; height: 100%; }
  #boot { display: flex; min-height: 100dvh; align-items: center; justify-content: center; flex-direction: column; gap: 12px; padding: 24px; text-align: center; }
  #boot b { font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.12em; font-size: 22px; }
  #boot p { color: #8d859f; font-size: 13px; margin: 0; }
</style>
</head>
<body>
<div id="boot"><b>PALACE</b><p>Loading the live table…</p></div>
<script>
(async function () {
  const REPO = 'theharislt-netizen/garage-gains';
  const REFS = ['cursor/winner-kick-rewards-e78b', 'cursor/card-game-setup-e78b', 'main'];
  const DIR = 'card-game/live-update';
  const boot = document.getElementById('boot');
  function note(msg) { if (boot) boot.querySelector('p').textContent = msg; }

  async function inflateRaw(bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function unzip(buf) {
    const u8 = new Uint8Array(buf);
    const view = new DataView(buf);
    let eocd = -1;
    for (let i = u8.length - 22; i >= 0; i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('zip');
    const count = view.getUint16(eocd + 10, true);
    let p = view.getUint32(eocd + 16, true);
    const files = {};
    for (let n = 0; n < count; n++) {
      if (view.getUint32(p, true) !== 0x02014b50) break;
      const method = view.getUint16(p + 10, true);
      const comp = view.getUint32(p + 20, true);
      const nameLen = view.getUint16(p + 28, true);
      const extraLen = view.getUint16(p + 30, true);
      const commentLen = view.getUint16(p + 32, true);
      const localOff = view.getUint32(p + 42, true);
      const name = new TextDecoder().decode(u8.slice(p + 46, p + 46 + nameLen));
      p += 46 + nameLen + extraLen + commentLen;
      const lname = view.getUint16(localOff + 26, true);
      const lextra = view.getUint16(localOff + 28, true);
      const data = u8.slice(localOff + 30 + lname + lextra, localOff + 30 + lname + lextra + comp);
      files[name] = method === 8 ? await inflateRaw(data) : data;
    }
    return files;
  }

  function mimeFor(name) {
    const lower = name.toLowerCase();
    if (lower.endsWith('.html')) return 'text/html';
    if (lower.endsWith('.js')) return 'text/javascript';
    if (lower.endsWith('.css')) return 'text/css';
    if (lower.endsWith('.woff2')) return 'font/woff2';
    if (lower.endsWith('.png')) return 'image/png';
    if (lower.endsWith('.json')) return 'application/json';
    return 'application/octet-stream';
  }

  async function getJson(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return null;
    const j = await res.json();
    return j && j.version ? j : null;
  }

  async function manifest(ref) {
    const j = await getJson('https://raw.githubusercontent.com/' + REPO + '/' + ref + '/' + DIR + '/manifest.json?t=' + Date.now());
    if (!j) return null;
    const v = encodeURIComponent(j.version);
    return {
      version: j.version,
      zips: [
        './www.zip?v=' + v,
        'https://raw.githubusercontent.com/' + REPO + '/' + ref + '/' + DIR + '/www.zip?v=' + v,
      ],
    };
  }

  let picked = null;
  for (const ref of REFS) {
    try { picked = await manifest(ref); } catch (_) { picked = null; }
    if (picked) break;
  }
  if (!picked) {
    note('Could not reach the live table. Check your connection.');
    return;
  }
  note('Updating to ' + picked.version + '…');
  let zipBuf = null;
  for (const zipUrl of picked.zips) {
    try {
      const zipRes = await fetch(zipUrl, { cache: 'no-store' });
      if (zipRes.ok) { zipBuf = await zipRes.arrayBuffer(); break; }
    } catch (_) { /* try next */ }
  }
  if (!zipBuf) throw new Error('could not download the table');
  note('Unpacking the table…');
  const files = await unzip(zipBuf);
  if (!files['index.html']) throw new Error('table zip is missing index.html');
  const blobs = {};
  const names = Object.keys(files).sort((a, b) => b.length - a.length);
  names.forEach((name) => {
    if (name === 'index.html' || name.toLowerCase().endsWith('.css')) return;
    blobs[name] = URL.createObjectURL(new Blob([files[name]], { type: mimeFor(name) }));
  });
  names.forEach((name) => {
    if (!name.toLowerCase().endsWith('.css')) return;
    let css = new TextDecoder().decode(files[name]);
    names.forEach((other) => {
      if (!blobs[other]) return;
      const base = other.split('/').pop();
      css = css.split('./' + base).join(blobs[other]);
    });
    blobs[name] = URL.createObjectURL(new Blob([css], { type: 'text/css' }));
  });
  let html = new TextDecoder().decode(files['index.html']);
  names.forEach((name) => {
    if (name === 'index.html' || !blobs[name]) return;
    html = html.split('./' + name).join(blobs[name]);
    html = html.split('"' + name + '"').join('"' + blobs[name] + '"');
    html = html.split("'" + name + "'").join("'" + blobs[name] + "'");
  });
  note('Starting…');
  document.open();
  document.write(html);
  document.close();
})().catch((err) => {
  const p = document.querySelector('#boot p');
  if (p) p.textContent = 'Load failed — ' + (err && err.message ? err.message : 'try again');
});
</script>
</body>
</html>
