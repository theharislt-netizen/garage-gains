name: iOS

on:
  push:
    branches: [main, cursor/android-apk-eee8]
  pull_request:
  workflow_dispatch:

jobs:
  probe-repo-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository Action secrets and variables
        env:
          IOS_TEAM_ID_SECRET: ${{ secrets.IOS_TEAM_ID }}
          IOS_TEAM_ID_VAR: ${{ vars.IOS_TEAM_ID }}
          ASC_KEY_ID_SECRET: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_KEY_ID_VAR: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_SECRET: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_ISSUER_VAR: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_SECRET: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_API_KEY_VAR: ${{ vars.APP_STORE_CONNECT_API_KEY }}
        run: |
          echo "repo_secret_ios_team_id=$([[ -n "$IOS_TEAM_ID_SECRET" ]] && echo set || echo missing)"
          echo "repo_var_ios_team_id=$([[ -n "$IOS_TEAM_ID_VAR" ]] && echo set || echo missing)"
          echo "repo_secret_asc_key_id=$([[ -n "$ASC_KEY_ID_SECRET" ]] && echo set || echo missing)"
          echo "repo_var_asc_key_id=$([[ -n "$ASC_KEY_ID_VAR" ]] && echo set || echo missing)"
          echo "repo_secret_asc_issuer=$([[ -n "$ASC_ISSUER_SECRET" ]] && echo set || echo missing)"
          echo "repo_var_asc_issuer=$([[ -n "$ASC_ISSUER_VAR" ]] && echo set || echo missing)"
          echo "repo_secret_asc_api_key=$([[ -n "$ASC_API_KEY_SECRET" ]] && echo set || echo missing)"
          echo "repo_var_asc_api_key=$([[ -n "$ASC_API_KEY_VAR" ]] && echo set || echo missing)"

  probe-pages-env-secrets:
    if: github.ref == 'refs/heads/cursor/android-apk-eee8'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Check github-pages environment secrets
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          echo "pages_env_ios_team_id=$([[ -n "$IOS_TEAM_ID" ]] && echo set || echo missing)"
          echo "pages_env_asc_key_id=$([[ -n "$APP_STORE_CONNECT_KEY_ID" ]] && echo set || echo missing)"
          echo "pages_env_asc_issuer=$([[ -n "$APP_STORE_CONNECT_ISSUER_ID" ]] && echo set || echo missing)"
          echo "pages_env_asc_api_key=$([[ -n "$APP_STORE_CONNECT_API_KEY" ]] && echo set || echo missing)"

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check Apple signing secrets
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID || vars.IOS_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || vars.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY || vars.APP_STORE_CONNECT_API_KEY }}
          IOS_TEAM_ID_SECRET: ${{ secrets.IOS_TEAM_ID }}
          IOS_TEAM_ID_VAR: ${{ vars.IOS_TEAM_ID }}
          ASC_KEY_ID_SECRET: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_KEY_ID_VAR: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_SECRET: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_ISSUER_VAR: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_SECRET: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_API_KEY_VAR: ${{ vars.APP_STORE_CONNECT_API_KEY }}
        run: |
          echo "repo_secret_ios_team_id=$([[ -n "$IOS_TEAM_ID_SECRET" ]] && echo set || echo missing)"
          echo "repo_var_ios_team_id=$([[ -n "$IOS_TEAM_ID_VAR" ]] && echo set || echo missing)"
          echo "repo_secret_asc_key_id=$([[ -n "$ASC_KEY_ID_SECRET" ]] && echo set || echo missing)"
          echo "repo_var_asc_key_id=$([[ -n "$ASC_KEY_ID_VAR" ]] && echo set || echo missing)"
          echo "repo_secret_asc_issuer=$([[ -n "$ASC_ISSUER_SECRET" ]] && echo set || echo missing)"
          echo "repo_var_asc_issuer=$([[ -n "$ASC_ISSUER_VAR" ]] && echo set || echo missing)"
          echo "repo_secret_asc_api_key=$([[ -n "$ASC_API_KEY_SECRET" ]] && echo set || echo missing)"
          echo "repo_var_asc_api_key=$([[ -n "$ASC_API_KEY_VAR" ]] && echo set || echo missing)"
          echo "ios_team_id=$([[ -n "$IOS_TEAM_ID" ]] && echo set || echo missing)"
          echo "asc_key_id=$([[ -n "$APP_STORE_CONNECT_KEY_ID" ]] && echo set || echo missing)"
          echo "asc_issuer=$([[ -n "$APP_STORE_CONNECT_ISSUER_ID" ]] && echo set || echo missing)"
          echo "asc_api_key=$([[ -n "$APP_STORE_CONNECT_API_KEY" ]] && echo set || echo missing)"
          if [[ -z "$IOS_TEAM_ID" || -z "$APP_STORE_CONNECT_KEY_ID" || -z "$APP_STORE_CONNECT_ISSUER_ID" || -z "$APP_STORE_CONNECT_API_KEY" ]]; then
            echo "TestFlight signing skipped until repository Action secrets exist (not GitHub Environment secrets)."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Verify iOS project files
        run: npm run test:ios

      - name: Prepare web assets and sync iOS
        run: |
          npm run prepare:www
          npx cap sync ios

      - name: Compile iOS app (simulator, unsigned)
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iPhone IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID || vars.IOS_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || vars.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY || vars.APP_STORE_CONNECT_API_KEY }}
        run: |
          chmod +x scripts/package-ios-ipa.sh
          SKIP_PREPARE=1 bash scripts/package-ios-ipa.sh

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: RIGCORE-iOS
          path: dist/RIGCORE.ipa
