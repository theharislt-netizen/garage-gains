name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, cursor/android-apk-eee8]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Pages status
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "Published https://theharislt-netizen.github.io/garage-gains/"
          else
            echo "::warning::GitHub Pages is not enabled yet, so the iPhone link 404s. Enable it at https://github.com/theharislt-netizen/garage-gains/settings/pages then re-run this workflow."
          fi
